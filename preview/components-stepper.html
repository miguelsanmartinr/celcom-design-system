<!DOCTYPE html>
<!-- @dsCard group="Components" name="Onboarding Stepper" subtitle="Estado done / active / pending" viewport="700x160" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 28px 24px; background:#FAFBFD; font-family:var(--font-body); color:#0D1B33; }
  .stepper { display:flex; align-items:flex-start; }
  .step { flex:1; display:flex; flex-direction:column; align-items:center; }
  .top { display:flex; width:100%; align-items:center; }
  .line { flex:1; height: 1.5px; }
  .dot { width: 26px; height: 26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size: 11px; font-weight:700; }
  .label { text-align:center; margin-top: 10px; padding: 0 4px; }
  .label p { margin:0 0 2px; font-size:12px; }
  .label .sub { font-size: 10px; color:#9AACC8; }

  .done .dot { background:#E7EEF8; color:#0057B8; }
  .done .dot::after { content:"✓"; }
  .done .dot-num { display:none; }
  .line.done { background:#C7D2E6; }
  .active .dot { background:#0057B8; color:#fff; }
  .pending .dot { background:#F4F6FB; color:#9AACC8; }
  .line.pending { background:#F4F6FB; }
  .active-txt { font-weight:600; color:#0D1B33; }
  .done-txt { color:#3A4A6B; font-weight:500; }
  .pending-txt { color:#9AACC8; font-weight:500; }
</style>
</head>
<body>
  <div class="stepper">
    <div class="step">
      <div class="top"><div class="line" style="background:transparent"></div><div class="dot done"></div><div class="line done"></div></div>
      <div class="label"><p class="done-txt">Empresa</p><p class="sub">Datos básicos</p></div>
    </div>
    <div class="step">
      <div class="top"><div class="line done"></div><div class="dot done"></div><div class="line done"></div></div>
      <div class="label"><p class="done-txt">Plan</p><p class="sub">V1 / V2</p></div>
    </div>
    <div class="step">
      <div class="top"><div class="line done"></div><div class="dot" style="background:#0057B8;color:#fff">3</div><div class="line pending"></div></div>
      <div class="label"><p class="active-txt">Bot</p><p class="sub">Prompt + KB</p></div>
    </div>
    <div class="step">
      <div class="top"><div class="line pending"></div><div class="dot" style="background:#F4F6FB;color:#9AACC8">4</div><div class="line" style="background:transparent"></div></div>
      <div class="label"><p class="pending-txt">Admin</p><p class="sub">Acceso cliente</p></div>
    </div>
  </div>
</body>
</html>
