<!DOCTYPE html>
<!-- @dsCard group="Components" name="KPI Cards" subtitle="Flat cards · ícono lineal · delta sutil" viewport="700x160" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:#FAFBFD; font-family:var(--font-body); color:#0D1B33; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { background:#fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #EEF1F6; }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .head svg { color:#3A4A6B; }
  .head span { font-size:12px; color:#7A8EAD; }
  .val-row { display:flex; align-items:baseline; gap:8px; }
  .val { font-family: var(--font-heading); font-size: 26px; font-weight: 700; color: #0D1B33; margin: 0; letter-spacing: -0.02em; }
  .delta { font-size:11px; font-weight:600; display:inline-flex; align-items:center; gap:2px; }
  .up { color:#15803D; } .down { color:#B91C1C; }
</style>
</head>
<body>
  <div class="grid">
    <div class="kpi"><div class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>SMS enviados</span></div><div class="val-row"><p class="val">47.320</p><span class="delta up">↑ 12%</span></div></div>
    <div class="kpi"><div class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>Conversaciones</span></div><div class="val-row"><p class="val">8.941</p><span class="delta up">↑ 8%</span></div></div>
    <div class="kpi"><div class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Emails entregados</span></div><div class="val-row"><p class="val">23.100</p><span class="delta down">↓ 3%</span></div></div>
    <div class="kpi"><div class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4M8 14h.01M16 14h.01M9 18h6"/></svg><span>Chatbot hits</span></div><div class="val-row"><p class="val">11.500</p><span class="delta up">↑ 21%</span></div></div>
  </div>
</body>
</html>
