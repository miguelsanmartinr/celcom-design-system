<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success / Warning / Error / Info" viewport="700x200" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-body); }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--radius-lg); overflow:hidden; border:1px solid var(--border-subtle); }
  .sw .color { height: 56px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size: 18px; }
  .sw.warn .color { color: #001F5B; }
  .sw .meta { padding: 8px 12px; background:#fff; border-top:1px solid var(--border-subtle); }
  .sw .meta .name { font-size:var(--fs-sm); font-weight:700; color:var(--fg-1); }
  .sw .meta .hex { font-size:10px; color:var(--fg-3); font-family:var(--font-mono); }
  h5 { margin: 0 0 10px; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing:.08em; color: var(--fg-3); font-weight:700; }
</style>
</head>
<body>
  <h5>Semánticos</h5>
  <div class="row">
    <div class="sw"><div class="color" style="background:#22C55E">✓</div><div class="meta"><div class="name">Success</div><div class="hex">#22C55E</div></div></div>
    <div class="sw warn"><div class="color" style="background:#F59E0B">⚠</div><div class="meta"><div class="name">Warning</div><div class="hex">#F59E0B</div></div></div>
    <div class="sw"><div class="color" style="background:#EF4444">✕</div><div class="meta"><div class="name">Error</div><div class="hex">#EF4444</div></div></div>
    <div class="sw"><div class="color" style="background:#3A82D4">ℹ</div><div class="meta"><div class="name">Info</div><div class="hex">#3A82D4</div></div></div>
  </div>
</body>
</html>
