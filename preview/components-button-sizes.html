<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons — Sizes" subtitle="XS · Sm · Md · Lg" viewport="700x140" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-body); }
  .row { display:flex; gap: 12px; flex-wrap:wrap; align-items:center; }
  .btn { font-family:var(--font-body); font-weight:600; border:2px solid #FFB800; background:#FFB800; color:#001F5B; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .xs { padding:5px 10px; font-size:12px; }
  .sm { padding:7px 14px; font-size:14px; }
  .md { padding:10px 20px; font-size:16px; }
  .lg { padding:13px 28px; font-size:18px; }
  h5 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing:.08em; color: var(--fg-3); font-weight:700; }
</style>
</head>
<body>
  <h5>Tamaños</h5>
  <div class="row">
    <button class="btn xs">XS</button>
    <button class="btn sm">Pequeño</button>
    <button class="btn md">Mediano</button>
    <button class="btn lg">Grande</button>
  </div>
</body>
</html>
