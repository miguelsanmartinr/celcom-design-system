<!DOCTYPE html>
<!-- @dsCard group="Components" name="API Key Rows" subtitle="Developer config · copy / reveal" viewport="700x240" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#FAFBFD; font-family:var(--font-body); color:#0D1B33; }
  .stack { display:flex; flex-direction:column; gap: 8px; }
  .row { display:flex; align-items:center; gap:12px; background:#fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #EEF1F6; }
  .lbl { font-size: 12px; font-weight:600; color:#0D1B33; margin:0 0 2px; display:flex; align-items:center; gap:8px; }
  .env-live { background:#F4F6FB; color:#3A4A6B; font-size:10px; font-weight:500; padding:1px 7px; border-radius:9999px; }
  .env-test { background:#FFF7E0; color:#B45309; font-size:10px; font-weight:500; padding:1px 7px; border-radius:9999px; }
  code { font-family:'Fira Code', monospace; font-size: 12px; color:#3A4A6B; }
  .hint { font-size:11px; color:#9AACC8; margin:0; }
  .actions { margin-left:auto; display:flex; gap:6px; }
  .btn { background:#fff; border: 1px solid #EEF1F6; border-radius: 6px; padding: 5px 11px; font-size: 11px; color:#3A4A6B; cursor: pointer; font-family:var(--font-body); }
  .btn:hover { background:#FAFBFD; }
  .btn.danger { color:#B91C1C; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row">
      <div>
        <p class="lbl">Production API Key <span class="env-live">Live</span></p>
        <code>sk_live_celcom_••••••••••••a1b2c3</code>
        <p class="hint">Último uso: hace 2 min</p>
      </div>
      <div class="actions"><button class="btn">Ver</button><button class="btn">Copiar</button><button class="btn danger">Revocar</button></div>
    </div>
    <div class="row">
      <div>
        <p class="lbl">Sandbox API Key <span class="env-test">Test</span></p>
        <code>sk_test_celcom_••••••••••••w6v5u4</code>
        <p class="hint">Último uso: hace 3 h</p>
      </div>
      <div class="actions"><button class="btn">Ver</button><button class="btn">Copiar</button><button class="btn danger">Revocar</button></div>
    </div>
  </div>
</body>
</html>
