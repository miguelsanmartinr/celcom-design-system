<!DOCTYPE html>
<!-- @dsCard group="Type" name="Heading Scale" subtitle="Hero · H1 · H2 · H3 · H4" viewport="700x380" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family:var(--font-body); }
  .row { display:flex; align-items:baseline; gap: 18px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: 0; }
  .label { min-width: 150px; flex-shrink:0; }
  .chip { display:inline-block; background:rgba(0,87,184,.12); color:var(--celcom-primary); font-size:11px; font-weight:700; padding:2px 8px; border-radius: 999px; }
  .meta { font-size: 10px; color: var(--fg-3); margin-top: 3px; }
  .specimen { font-family: var(--font-heading); color: var(--fg-1); line-height: 1.1; margin: 0; flex:1; }
</style>
</head>
<body>
  <div class="row"><div class="label"><span class="chip">Hero</span><div class="meta">48px · 800 · Poppins</div></div><p class="specimen" style="font-size:42px;font-weight:800">Somos el puente</p></div>
  <div class="row"><div class="label"><span class="chip">H1</span><div class="meta">36px · 700</div></div><p class="specimen" style="font-size:32px;font-weight:700">Automatiza tu atención</p></div>
  <div class="row"><div class="label"><span class="chip">H2</span><div class="meta">30px · 700</div></div><p class="specimen" style="font-size:26px;font-weight:700">¿Quiénes somos?</p></div>
  <div class="row"><div class="label"><span class="chip">H3</span><div class="meta">24px · 600</div></div><p class="specimen" style="font-size:22px;font-weight:600">Servicios de comunicación</p></div>
  <div class="row"><div class="label"><span class="chip">H4</span><div class="meta">20px · 600</div></div><p class="specimen" style="font-size:18px;font-weight:600">WhatsApp API Business</p></div>
</body>
</html>
