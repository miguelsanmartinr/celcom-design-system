<!DOCTYPE html>
<!-- @dsCard group="Type" name="Poppins" subtitle="Display — Regular → ExtraBold" viewport="700x220" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-body); }
  .specimen { font-family: var(--font-heading); font-weight: 800; color: var(--fg-1); line-height: 1.1; }
  .poppins-name { font-family: var(--font-heading); font-weight: 800; font-size: 80px; color: var(--celcom-primary); letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .tag { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); margin: 4px 0 14px; }
  .weights { display:flex; gap: 24px; align-items:baseline; margin-top: 12px; flex-wrap:wrap; }
  .w { font-family: var(--font-heading); font-size: 32px; color: var(--fg-1); }
</style>
</head>
<body>
  <p class="tag">Display type · Poppins</p>
  <p class="poppins-name">Poppins</p>
  <div class="weights">
    <span class="w" style="font-weight:400">Regular</span>
    <span class="w" style="font-weight:500">Medium</span>
    <span class="w" style="font-weight:600">Semibold</span>
    <span class="w" style="font-weight:700">Bold</span>
    <span class="w" style="font-weight:800">ExtraBold</span>
  </div>
</body>
</html>
