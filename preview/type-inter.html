<!DOCTYPE html>
<!-- @dsCard group="Type" name="Inter" subtitle="Variable (wght 100–900, opsz 14–32) — archivo local" viewport="700x240" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:28px; background:#fff; font-family:var(--font-body); }
  .name { font-family: var(--font-body); font-weight: 700; font-variation-settings: 'wght' 700, 'opsz' 32; font-size: 72px; color: var(--celcom-secondary); letter-spacing: -0.02em; line-height: 1; margin: 0; }
  .tag { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); margin: 4px 0 14px; display:flex; align-items:center; gap:8px; }
  .tag .chip { background: var(--celcom-n-100); color: var(--celcom-n-700); padding: 2px 7px; border-radius: 9999px; font-size: 9px; letter-spacing: .04em; }
  .weights { display:flex; gap: 18px; align-items:baseline; margin-top: 10px; flex-wrap:wrap; }
  .w { font-family: var(--font-body); font-size: 22px; color: var(--fg-1); }
  .sample { margin-top: 14px; font-family: var(--font-body); font-size: 14px; color: var(--fg-2); max-width: 640px; }
  .axes { margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
  <p class="tag">Body + UI · Inter <span class="chip">Variable · local</span></p>
  <p class="name">Inter</p>
  <div class="weights">
    <span class="w" style="font-weight:300">Light</span>
    <span class="w" style="font-weight:400">Regular</span>
    <span class="w" style="font-weight:500">Medium</span>
    <span class="w" style="font-weight:600">Semibold</span>
    <span class="w" style="font-weight:700">Bold</span>
    <span class="w" style="font-weight:800">ExtraBold</span>
  </div>
  <p class="axes">axes: wght 100–900 · opsz 14–32</p>
  <p class="sample">Celcom es un integrador móvil de valor agregado que ofrece plataformas bidireccionales de contactabilidad basadas en mensajería A2P.</p>
</body>
</html>
