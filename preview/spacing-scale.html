<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base — 1..20" viewport="700x160" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family:var(--font-body); }
  .grid { display:flex; gap: 16px; align-items:flex-end; flex-wrap:wrap; }
  .item { text-align:center; }
  .sq { background: var(--celcom-primary-light); border-radius: 4px; margin: 0 auto 6px; }
  .name { font-size: 10px; color: var(--fg-3); margin:0; }
  .val { font-size: 10px; color: var(--fg-2); font-weight: 700; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="sq" style="width:4px;height:4px"></div><p class="name">1</p><p class="val">4px</p></div>
    <div class="item"><div class="sq" style="width:8px;height:8px"></div><p class="name">2</p><p class="val">8px</p></div>
    <div class="item"><div class="sq" style="width:12px;height:12px"></div><p class="name">3</p><p class="val">12px</p></div>
    <div class="item"><div class="sq" style="width:16px;height:16px"></div><p class="name">4</p><p class="val">16px</p></div>
    <div class="item"><div class="sq" style="width:20px;height:20px"></div><p class="name">5</p><p class="val">20px</p></div>
    <div class="item"><div class="sq" style="width:24px;height:24px"></div><p class="name">6</p><p class="val">24px</p></div>
    <div class="item"><div class="sq" style="width:32px;height:32px"></div><p class="name">8</p><p class="val">32px</p></div>
    <div class="item"><div class="sq" style="width:40px;height:40px"></div><p class="name">10</p><p class="val">40px</p></div>
    <div class="item"><div class="sq" style="width:48px;height:48px"></div><p class="name">12</p><p class="val">48px</p></div>
    <div class="item"><div class="sq" style="width:64px;height:64px"></div><p class="name">16</p><p class="val">64px</p></div>
    <div class="item"><div class="sq" style="width:80px;height:80px"></div><p class="name">20</p><p class="val">80px</p></div>
  </div>
</body>
</html>
