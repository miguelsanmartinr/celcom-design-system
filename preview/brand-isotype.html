<!DOCTYPE html>
<!-- @dsCard group="Brand" name="App Isotype" subtitle="Isotipo 'C' blanco sobre azul + confeti" viewport="700x220" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Brand — App Isotype</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-2); display:flex; align-items:center; justify-content:center; height:100vh; box-sizing:border-box; gap:24px; font-family:var(--font-body); }
  .iso { width: 140px; height: 140px; border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-lg); }
  .iso img { width:100%; height:100%; display:block; }
  .meta { }
  .meta h4 { margin: 0 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: var(--fs-lg); color: var(--fg-1); }
  .meta p { margin: 0; font-size: var(--fs-sm); color: var(--fg-3); max-width: 320px; }
  .sizes { display:flex; align-items:flex-end; gap:14px; margin-top:14px; }
  .sizes img { border-radius: 10px; }
  .s1 { width:56px;height:56px; border-radius: 12px !important; }
  .s2 { width:40px;height:40px; border-radius: 10px !important; }
  .s3 { width:28px;height:28px; border-radius: 7px !important; }
</style>
</head>
<body>
  <div class="iso"><img src="../assets/logo-celcom-app.jpg" alt="App icon"></div>
  <div class="meta">
    <h4>Isotipo de app</h4>
    <p>"C" blanca sobre azul primario, con confeti amarillo. Solo para icono de app / avatar / favicon — no reemplaza el wordmark.</p>
    <div class="sizes">
      <img src="../assets/logo-celcom-app.jpg" class="s1" alt="">
      <img src="../assets/logo-celcom-app.jpg" class="s2" alt="">
      <img src="../assets/logo-celcom-app.jpg" class="s3" alt="">
    </div>
  </div>
</body>
</html>
