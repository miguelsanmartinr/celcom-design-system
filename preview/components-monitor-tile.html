<!DOCTYPE html>
<!-- @dsCard group="Components" name="Monitor Tile" subtitle="KPIs operacionales" viewport="760x140" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:22px; background:#FAFBFD; font-family:var(--font-body); color:#0D1B33; }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
  .tile { background:#fff; border:1px solid #EEF1F6; border-radius:12px; padding:18px 20px; }
  .lbl { font-size:12px; color:#7A8EAD; margin:0 0 10px; }
  .val { font-family: var(--font-heading); font-size:24px; font-weight:700; color:#0D1B33; margin:0; letter-spacing:-0.02em; }
  .val.warn { color:#B45309; }
  .hint { font-size:11px; margin:4px 0 0; }
  .up { color:#15803D; }
  .wa { color:#B45309; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile"><p class="lbl">Clientes activos</p><p class="val">24</p><p class="hint up">↑ +2 este mes</p></div>
    <div class="tile"><p class="lbl">Conversaciones hoy</p><p class="val">1.847</p><p class="hint up">↑ +12% vs ayer</p></div>
    <div class="tile"><p class="lbl">Resolución automática</p><p class="val">78%</p><p class="hint up">↑ +3pp este mes</p></div>
    <div class="tile"><p class="lbl">Alertas pendientes</p><p class="val warn">4</p><p class="hint wa">⚠ 2 sobre 80%</p></div>
  </div>
</body>
</html>
