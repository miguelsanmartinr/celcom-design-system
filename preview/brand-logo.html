<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo (wordmark)" subtitle="Wordmark en light / dark / accent" viewport="700x220" -->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Brand — Logo (Primary)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; background: var(--celcom-white); padding: 32px; display:flex; align-items:center; justify-content:center; height:100vh; box-sizing:border-box; }
  .wrap { display:flex; gap: 32px; align-items:center; width:100%; max-width: 620px; }
  .logo-tile { flex:1; display:flex; align-items:center; justify-content:center; padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  .logo-tile.dark { background: var(--celcom-secondary); border-color: transparent; }
  .logo-tile.accent { background: var(--celcom-accent); border-color: transparent; }
  .logo-tile img { max-width: 140px; height: auto; }
  .logo-tile.dark img { filter: brightness(0) invert(1); }
  .logo-tile.accent img { }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-tile"><img src="../assets/logo-celcom.svg" alt="Celcom"></div>
    <div class="logo-tile dark"><img src="../assets/logo-celcom.svg" alt="Celcom"></div>
    <div class="logo-tile accent"><img src="../assets/logo-celcom.svg" alt="Celcom"></div>
  </div>
</body>
</html>
