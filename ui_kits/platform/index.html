<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Celcom Platform — Panel SaaS</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;font-family:'Inter',sans-serif;background:#FAFBFD;color:#0D1B33;-webkit-font-smoothing:antialiased;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="ChatbotPages.jsx"></script>
<script type="text/babel" src="ExtraScreens.jsx"></script>
<script type="text/babel">
function App() {
  const [active, setActive] = React.useState(() => localStorage.getItem("celcom.platform.active") || "dashboard");
  React.useEffect(() => { localStorage.setItem("celcom.platform.active", active); }, [active]);
  const titles = { dashboard:"Dashboard", campaigns:"Campañas", whatsapp:"Inbox WhatsApp", email:"Email Marketing", chatbots:"Chatbots", api:"API Keys", settings:"Ajustes", billing:"Facturación" };
  return (
    <div data-screen-label="Celcom Platform" style={{ display:"flex", minHeight:"100vh" }}>
      <CelcomSidebar active={active} onSelect={setActive} />
      <div style={{ flex:1, display:"flex", flexDirection:"column" }}>
        <CelcomTopbar title={titles[active] || "Celcom"} />
        {active === "dashboard" && <CelcomDashboard />}
        {active === "campaigns" && <CelcomCampaignsTable />}
        {active === "whatsapp" && <CelcomWhatsAppInbox />}
        {active === "email" && <CelcomEmailMarketing />}
        {active === "chatbots" && <CelcomChatbots />}
        {active === "api" && <CelcomApiKeys />}
        {active === "settings" && <CelcomSettings />}
        {active === "billing" && <CelcomBilling />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
